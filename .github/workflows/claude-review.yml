# Thin caller — review logic lives in the org .github repo (reusable
# workflow). synchronize is required: rulesets dismiss stale reviews on push,
# so the verdict must be re-issued for every new head.
name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: LEA-Product-and-Engineering/.github/.github/workflows/claude-review.yml@main
    with:
      review_focus: |
        STACK: customer-distributed Claude Code plugins/skills for wealth
        management (Box, Egnyte, SharePoint, Practifi, Wealthbox). Watch
        especially for: skill instructions that could be hijacked by
        prompt-injected document content, destructive or bulk file
        operations without safeguards, credential/token mishandling, client
        PII written to reports or logs unnecessarily, and data leaving the
        customer's environment.
    secrets:
      review_app_id: ${{ secrets.LEA_REVIEW_APP_ID }}
      review_app_private_key: ${{ secrets.LEA_REVIEW_APP_PRIVATE_KEY }}
