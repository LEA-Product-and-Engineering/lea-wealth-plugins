name: LLM Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: llm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    uses: LEA-Product-and-Engineering/.github/.github/workflows/llm-review.yml@f52962796957a6de97e64f752b45b9511fbb989e
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      review_app_id: ${{ secrets.LEA_REVIEW_APP_ID }}
      review_app_private_key: ${{ secrets.LEA_REVIEW_APP_PRIVATE_KEY }}
